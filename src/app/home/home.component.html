<div class="app-content p-5">
  <div
    class="search-section d-flex justify-content-center gap-3 align-items-center"
  >
    <app-dropdown-filter
      class="w-25"
      icon="bi bi-geo-alt fs-3"
      itemDescriptionField="district"
      itemKeyField="district"
      [items]="(districts$ | async) || []"
      (selectedEvent)="onDistrictSelected($event)"
      (searchEvent)="onLocationSearch($event)"
    >
      <ng-template let-item>
        <div class="d-flex flex-column justify-content-center h-100">
          <span class="dropdown-span">{{ RegionsService.getLabel(item) }}</span>
          <small>{{ RegionsService.getHitKind(item) }}</small>
        </div>
      </ng-template>
    </app-dropdown-filter>
    <div class="input-group w-50">
      <span class="input-group-text">
        <i class="bi bi-search fs-3"></i>
      </span>
      <input
        i18n-placeholder="@@searchInputPlaceHolder"
        type="text"
        class="form-control"
        placeholder="What are you looking for?"
        aria-label="What are you looking for?"
      />
    </div>
  </div>
  <div class="mt-5 w-100">
    <h3 i18n="@@mainCategoriesTitle">Main Categories</h3>
    <div class="py-4 d-flex flex-wrap justify-content-between align-items-center">
      <ng-container *ngTemplateOutlet="categoryCardLoading"></ng-container>
      <ng-container *ngTemplateOutlet="categoryCardLoading"></ng-container>
      <ng-container *ngTemplateOutlet="categoryCardLoading"></ng-container>
      <ng-container *ngTemplateOutlet="categoryCardLoading"></ng-container>
      <ng-container *ngTemplateOutlet="categoryCardLoading"></ng-container>
      <ng-container *ngTemplateOutlet="categoryCardLoading"></ng-container>
    </div>
  </div>
</div>
<ng-template #categoryCardLoading>
  <div class="category-card gap-2" aria-hidden="true" type="button" [routerLink]="'/listing'">
    <img
      src="https://espacocasa.com/wp-content/uploads/2025/06/560286_3-200x200.png"
      class="rounded"
      alt="..."
    />
    <h5>Plumbing</h5>
  </div>
</ng-template>
